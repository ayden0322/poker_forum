<!DOCTYPE html><html><head><meta charset="utf8"><style>html,body{margin:0;background:transparent}</style></head>
<body><canvas id="c" width="420" height="420"></canvas>
<script>
const FRAG=`
precision highp float; uniform float u_time; uniform vec2 u_res;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.)); vec2 u=f*f*(3.-2.*f); return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y; }
float fbm(vec2 p){ float v=0.,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
vec3 firePalette(float t){ vec3 c=mix(vec3(0.35,0.0,0.0),vec3(0.85,0.12,0.0),smoothstep(0.0,0.35,t)); c=mix(c,vec3(1.0,0.45,0.05),smoothstep(0.35,0.58,t)); c=mix(c,vec3(1.0,0.82,0.18),smoothstep(0.58,0.82,t)); c=mix(c,vec3(1.0,0.98,0.85),smoothstep(0.82,1.0,t)); return c; }
void main(){ vec2 uv=gl_FragCoord.xy/u_res; float t=u_time;
 vec2 q=vec2(uv.x*3.0,uv.y*3.4-t*1.6); vec2 warp=vec2(fbm(q+vec2(0.0,t*0.6)),fbm(q+vec2(5.2,t*0.6))); float n=fbm(q+warp*1.4);
 float rise=pow(1.0-uv.y,3.0); float horiz=smoothstep(0.0,0.16,uv.x)*smoothstep(1.0,0.84,uv.x); float base=mix(1.0,1.5,smoothstep(0.4,0.0,uv.y));
 float flame=clamp(n*rise*horiz*base*1.85,0.0,1.0); float alpha=smoothstep(0.18,0.42,flame); gl_FragColor=vec4(firePalette(flame),alpha); }`;
const VERT=`attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const c=document.getElementById('c'); const gl=c.getContext('webgl',{premultipliedAlpha:false,alpha:true,preserveDrawingBuffer:true});
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
gl.uniform2f(gl.getUniformLocation(pr,'u_res'),c.width,c.height);
window.drawT=(t)=>{ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(gl.getUniformLocation(pr,'u_time'),t); gl.drawArrays(gl.TRIANGLES,0,3); gl.finish(); };
window.drawT(0);
</script></body></html>
